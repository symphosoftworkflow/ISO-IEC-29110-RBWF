<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img">
  <title>RBWF Deployment Diagram</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="16" y="24" font-size="15" font-weight="600" fill="#111827" font-family="Segoe UI, Arial">RBWF Deployment Diagram</text>

  <rect x="40" y="50" width="820" height="250" fill="#f8fafc" stroke="#111827"/>
  <text x="50" y="72" font-size="13" font-weight="600" font-family="Segoe UI, Arial">Cloud VPS / Docker Compose host</text>
  <rect x="70" y="95" width="170" height="80" rx="6" fill="#e0e7ff" stroke="#111827"/>
  <text x="155" y="125" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">rbwf-nginx</text>
  <text x="155" y="145" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">:80 / :443</text>
  <rect x="280" y="95" width="170" height="80" rx="6" fill="#dbeafe" stroke="#111827"/>
  <text x="365" y="125" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">rbwf-frontend</text>
  <text x="365" y="145" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">Svelte static build</text>
  <rect x="490" y="95" width="170" height="80" rx="6" fill="#ccfbf1" stroke="#111827"/>
  <text x="575" y="125" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">rbwf-api</text>
  <text x="575" y="145" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">Go binary :8080</text>
  <rect x="280" y="200" width="170" height="70" rx="6" fill="#fef3c7" stroke="#111827"/>
  <text x="365" y="230" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">rbwf-mysql</text>
  <text x="365" y="248" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">:3306</text>
  <rect x="490" y="200" width="170" height="70" rx="6" fill="#ffe4e6" stroke="#111827"/>
  <text x="575" y="230" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">Redis</text>
  <text x="575" y="248" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">:6379</text>
  <text x="70" y="280" font-size="11" font-family="Segoe UI, Arial">Browser -- HTTPS -- nginx -- frontend assets and /api/v1 -- Go -- MySQL / Redis / files</text>

</svg>
