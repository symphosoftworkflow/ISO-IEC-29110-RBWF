<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img">
  <title>RBWF API Design Overview</title>
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="16" y="24" font-size="15" font-weight="600" fill="#111827" font-family="Segoe UI, Arial">RBWF API Design Overview</text>

  <rect x="40" y="50" width="200" height="130" rx="6" fill="#dbeafe" stroke="#111827"/>
  <text x="140" y="74" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">Auth / Users</text>
  <text x="55" y="98" font-size="11" font-family="Segoe UI, Arial">POST /api/v1/auth/login</text>
  <text x="55" y="116" font-size="11" font-family="Segoe UI, Arial">CRUD /api/v1/users</text>
  <text x="55" y="134" font-size="11" font-family="Segoe UI, Arial">GET /api/v1/roles</text>

  <rect x="260" y="50" width="210" height="130" rx="6" fill="#dcfce7" stroke="#111827"/>
  <text x="365" y="74" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">Stock</text>
  <text x="275" y="98" font-size="11" font-family="Segoe UI, Arial">GET/POST /api/v1/stock</text>
  <text x="275" y="116" font-size="11" font-family="Segoe UI, Arial">POST /api/v1/stock/adjust</text>
  <text x="275" y="134" font-size="11" font-family="Segoe UI, Arial">GET /api/v1/products</text>

  <rect x="490" y="50" width="220" height="130" rx="6" fill="#fef3c7" stroke="#111827"/>
  <text x="600" y="74" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">Sales</text>
  <text x="505" y="98" font-size="11" font-family="Segoe UI, Arial">/api/v1/rfq</text>
  <text x="505" y="116" font-size="11" font-family="Segoe UI, Arial">/api/v1/quotations</text>
  <text x="505" y="134" font-size="11" font-family="Segoe UI, Arial">approve by amount</text>

  <rect x="730" y="50" width="200" height="130" rx="6" fill="#ffe4e6" stroke="#111827"/>
  <text x="830" y="74" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">Purchase</text>
  <text x="745" y="98" font-size="11" font-family="Segoe UI, Arial">/api/v1/po</text>
  <text x="745" y="116" font-size="11" font-family="Segoe UI, Arial">/api/v1/po/receipts</text>
  <text x="745" y="134" font-size="11" font-family="Segoe UI, Arial">/api/v1/suppliers</text>

  <rect x="150" y="210" width="250" height="90" rx="6" fill="#ccfbf1" stroke="#111827"/>
  <text x="275" y="234" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">Worker / Queue</text>
  <text x="165" y="258" font-size="11" font-family="Segoe UI, Arial">/api/v1/worker-jobs</text>
  <text x="165" y="276" font-size="11" font-family="Segoe UI, Arial">WS /api/v1/ws/queue</text>

  <rect x="440" y="210" width="250" height="90" rx="6" fill="#ede9fe" stroke="#111827"/>
  <text x="565" y="234" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">Finance</text>
  <text x="455" y="258" font-size="11" font-family="Segoe UI, Arial">/api/v1/cash-ledger</text>
  <text x="455" y="276" font-size="11" font-family="Segoe UI, Arial">expenses / salary / reports</text>

</svg>
