<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img">
  <title>RBWF User Flow</title>
  <rect width="920" height="300" fill="#ffffff"/>
  <text x="16" y="24" font-size="15" font-weight="600" fill="#111827" font-family="Segoe UI, Arial">RBWF User Flow</text>

  <rect x="20" y="80" width="120" height="50" rx="6" fill="#dbeafe" stroke="#111827"/>
  <text x="80" y="110" text-anchor="middle" font-size="11" font-family="Segoe UI, Arial">RFQ</text>
  <rect x="170" y="80" width="120" height="50" rx="6" fill="#dbeafe" stroke="#111827"/>
  <text x="230" y="110" text-anchor="middle" font-size="11" font-family="Segoe UI, Arial">Quotation</text>
  <rect x="320" y="80" width="120" height="50" rx="6" fill="#fef3c7" stroke="#111827"/>
  <text x="380" y="110" text-anchor="middle" font-size="11" font-family="Segoe UI, Arial">Approve</text>
  <rect x="470" y="80" width="120" height="50" rx="6" fill="#ccfbf1" stroke="#111827"/>
  <text x="530" y="110" text-anchor="middle" font-size="11" font-family="Segoe UI, Arial">Worker job</text>
  <rect x="620" y="80" width="120" height="50" rx="6" fill="#e0e7ff" stroke="#111827"/>
  <text x="680" y="110" text-anchor="middle" font-size="11" font-family="Segoe UI, Arial">Queue / DN</text>
  <rect x="770" y="80" width="120" height="50" rx="6" fill="#ede9fe" stroke="#111827"/>
  <text x="830" y="110" text-anchor="middle" font-size="11" font-family="Segoe UI, Arial">Cash ledger</text>
  <line x1="140" y1="105" x2="170" y2="105" stroke="#111827"/>
  <line x1="290" y1="105" x2="320" y2="105" stroke="#111827"/>
  <line x1="440" y1="105" x2="470" y2="105" stroke="#111827"/>
  <line x1="590" y1="105" x2="620" y2="105" stroke="#111827"/>
  <line x1="740" y1="105" x2="770" y2="105" stroke="#111827"/>
  <rect x="20" y="190" width="180" height="50" rx="6" fill="#dcfce7" stroke="#111827"/>
  <text x="110" y="220" text-anchor="middle" font-size="11" font-family="Segoe UI, Arial">Stock in / out</text>
  <rect x="250" y="190" width="180" height="50" rx="6" fill="#ffe4e6" stroke="#111827"/>
  <text x="340" y="220" text-anchor="middle" font-size="11" font-family="Segoe UI, Arial">PO + receipts</text>
  <line x1="110" y1="190" x2="110" y2="130" stroke="#6b7280"/>
  <line x1="340" y1="190" x2="530" y2="130" stroke="#6b7280"/>
  <text x="20" y="270" font-size="11" font-family="Segoe UI, Arial">Sales path: RFQ to quotation approval, worker prep, delivery note, then cash posting. Purchasing path: PO receipts update stock.</text>

</svg>
