<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img">
  <title>Sequence: create and approve quotation</title>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="16" y="24" font-size="15" font-weight="600" fill="#111827" font-family="Segoe UI, Arial">Sequence: create and approve quotation</text>

  <text x="80" y="55" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">Sales User</text>
  <text x="260" y="55" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">Svelte UI</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">Go API</text>
  <text x="640" y="55" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">MySQL</text>
  <text x="820" y="55" text-anchor="middle" font-size="12" font-weight="600" font-family="Segoe UI, Arial">PDF Store</text>
  <line x1="80" y1="65" x2="80" y2="300" stroke="#9ca3af"/>
  <line x1="260" y1="65" x2="260" y2="300" stroke="#9ca3af"/>
  <line x1="450" y1="65" x2="450" y2="300" stroke="#9ca3af"/>
  <line x1="640" y1="65" x2="640" y2="300" stroke="#9ca3af"/>
  <line x1="820" y1="65" x2="820" y2="300" stroke="#9ca3af"/>
  <line x1="80" y1="90" x2="260" y2="90" stroke="#111827"/>
  <text x="170" y="84" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">open quotation form</text>
  <line x1="260" y1="115" x2="450" y2="115" stroke="#111827"/>
  <text x="355" y="109" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">POST /api/v1/quotations</text>
  <line x1="450" y1="140" x2="640" y2="140" stroke="#111827"/>
  <text x="545" y="134" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">insert quote + items</text>
  <line x1="450" y1="170" x2="820" y2="170" stroke="#111827"/>
  <text x="630" y="164" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">render quotation PDF</text>
  <line x1="260" y1="210" x2="450" y2="210" stroke="#111827"/>
  <text x="355" y="204" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">POST approve by amount</text>
  <line x1="450" y1="240" x2="640" y2="240" stroke="#111827"/>
  <text x="545" y="234" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">update status</text>
  <line x1="450" y1="270" x2="260" y2="270" stroke="#111827"/>
  <text x="355" y="264" text-anchor="middle" font-size="10" font-family="Segoe UI, Arial">status Approved + pdf_path</text>

</svg>
