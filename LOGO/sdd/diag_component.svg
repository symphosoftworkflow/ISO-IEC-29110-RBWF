<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img">
  <title>RBWF Component Diagram</title>
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="16" y="24" font-size="15" font-weight="600" fill="#111827" font-family="Segoe UI, Arial">RBWF Component Diagram</text>

  <rect x="40" y="50" width="220" height="110" rx="6" fill="#dbeafe" stroke="#111827"/>
  <text x="150" y="72" text-anchor="middle" font-size="13" font-weight="600" font-family="Segoe UI, Arial">Svelte Frontend</text>
  <text x="55" y="96" font-size="11" font-family="Segoe UI, Arial">Stock / RFQ / Quotation</text>
  <text x="55" y="112" font-size="11" font-family="Segoe UI, Arial">PO / Worker / Queue DN</text>
  <text x="55" y="128" font-size="11" font-family="Segoe UI, Arial">Finance / Users / Reports</text>

  <rect x="320" y="50" width="220" height="110" rx="6" fill="#e0e7ff" stroke="#111827"/>
  <text x="430" y="72" text-anchor="middle" font-size="13" font-weight="600" font-family="Segoe UI, Arial">Nginx Reverse Proxy</text>
  <text x="335" y="96" font-size="11" font-family="Segoe UI, Arial">HTTPS port 80 / 443</text>
  <text x="335" y="112" font-size="11" font-family="Segoe UI, Arial">Static assets and /api</text>

  <rect x="600" y="50" width="260" height="110" rx="6" fill="#ccfbf1" stroke="#111827"/>
  <text x="730" y="72" text-anchor="middle" font-size="13" font-weight="600" font-family="Segoe UI, Arial">Go REST API + WS Hub</text>
  <text x="615" y="96" font-size="11" font-family="Segoe UI, Arial">JWT and RBAC middleware</text>
  <text x="615" y="112" font-size="11" font-family="Segoe UI, Arial">Business handlers and PDF</text>
  <text x="615" y="128" font-size="11" font-family="Segoe UI, Arial">WebSocket queue updates</text>

  <line x1="260" y1="105" x2="320" y2="105" stroke="#111827" stroke-width="1.5"/>
  <line x1="540" y1="105" x2="600" y2="105" stroke="#111827" stroke-width="1.5"/>
  <line x1="680" y1="160" x2="680" y2="210" stroke="#111827" stroke-width="1.5"/>
  <line x1="730" y1="160" x2="790" y2="210" stroke="#111827" stroke-width="1.5"/>
  <line x1="650" y1="160" x2="490" y2="210" stroke="#111827" stroke-width="1.5"/>
  <line x1="620" y1="160" x2="290" y2="210" stroke="#111827" stroke-width="1.5"/>

  <rect x="180" y="210" width="200" height="80" rx="6" fill="#fef3c7" stroke="#111827"/>
  <text x="280" y="236" text-anchor="middle" font-size="13" font-weight="600" font-family="Segoe UI, Arial">MySQL 8</text>
  <text x="195" y="258" font-size="11" font-family="Segoe UI, Arial">Master data and ledgers</text>

  <rect x="410" y="210" width="180" height="80" rx="6" fill="#ffe4e6" stroke="#111827"/>
  <text x="500" y="236" text-anchor="middle" font-size="13" font-weight="600" font-family="Segoe UI, Arial">Redis</text>
  <text x="425" y="258" font-size="11" font-family="Segoe UI, Arial">Cache layer</text>

  <rect x="620" y="210" width="220" height="80" rx="6" fill="#ede9fe" stroke="#111827"/>
  <text x="730" y="236" text-anchor="middle" font-size="13" font-weight="600" font-family="Segoe UI, Arial">File Storage</text>
  <text x="635" y="258" font-size="11" font-family="Segoe UI, Arial">PDF and photo uploads</text>

</svg>
